<!DOCTYPE html>
<html lang="en" xlmns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>

    <style>
        .failed{
            color: red;
        }
        .success{
            color: green;
        }
    </style>

</head>
<body>

<h1>Login Page</h1>

<form action="#" method="POST" th:action="@{/authenticateTheUser}">

    <div th:if="${param.error}">
        <i class="failed">Invalid username and password.</i>
    </div>

    <div th:if="${param.logout}">
        <i class="success"> Logout successfully.</i>
    </div>

    <p>
        User Name: <input type="text"  name="username" />
    </p>

    <p>
        Password: <input type="password"  name="password" />
    </p>

    <input type="submit" value="Login" />

</form>

</body>
</html>
